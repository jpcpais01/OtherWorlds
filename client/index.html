<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OtherWorlds</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; background: #000; color: #eee; font: 13px/1.35 system-ui, sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  /* Clips off the bottom 1/32 of the frame, where the frame-ID code lives. */
  #view { aspect-ratio: 32 / 31; width: min(100%, calc((100dvh - 150px) * 32 / 31)); overflow: hidden; background: #111; }
  #view video, #view canvas { display: block; width: 100%; aspect-ratio: 1; }
  /* Decart mode: 16:9 output and no frame-ID strip to hide. */
  #view.wide { aspect-ratio: 16 / 9; width: min(100%, calc((100dvh - 150px) * 16 / 9)); }
  #view.wide video { aspect-ratio: 16 / 9; }
  #hud { position: absolute; top: 8px; left: 8px; padding: 6px 8px; background: rgba(0,0,0,.6); border-radius: 6px;
         font: 11px/1.4 ui-monospace, Menlo, monospace; white-space: pre; pointer-events: none; }
  #controls { padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); display: grid; gap: 6px; background: #111; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button, select, input { font: inherit; color: inherit; background: #222; border: 1px solid #444; border-radius: 6px; padding: 7px 10px; }
  button.on { background: #3a5bd9; border-color: #3a5bd9; }
  #start { background: #2a7a3a; border-color: #2a7a3a; font-weight: 600; }
  input[type=text] { flex: 1; min-width: 0; }
  label { display: flex; gap: 4px; align-items: center; color: #aaa; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="view">
    <video id="out" playsinline muted autoplay></video>
    <canvas id="outc" class="hidden"></canvas>
  </div>
  <div id="hud">tap Start</div>
</div>
<div id="controls">
  <div class="row" id="styles">
    <button data-style="ghibli" class="on">Ghibli</button>
    <button data-style="cyberpunk">Cyberpunk</button>
    <button data-style="zombie">Zombie</button>
  </div>
  <div class="row">
    <input id="prompt" type="text" placeholder="custom prompt…">
    <button id="apply">Apply</button>
  </div>
  <div class="row">
    <button id="refpick">Style from photo</button>
    <button id="refclear" class="hidden">Clear photo</button>
    <input id="reffile" type="file" accept="image/*" class="hidden">
  </div>
  <div class="row">
    <label>Res <select id="res"><option>256</option><option>384</option><option selected>512</option><option>640</option><option>768</option></select></label>
    <label>Strength <select id="strength"><option value="0.3">low</option><option value="0.5">mid</option><option value="0.7" selected>high</option><option value="0.9">max</option></select></label>
    <label>Link <select id="mode"><option value="ws" selected>WebSocket</option><option value="auto">auto</option><option value="webrtc">WebRTC</option><option value="decart">Decart (cloud)</option></select></label>
    <button id="flip">Flip cam</button>
    <button id="start">Start</button>
  </div>
</div>
<video id="cam" playsinline muted autoplay class="hidden"></video>
<script src="app.js"></script>
</body>
</html>
